[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topic3d"
version = "0.dev8"
description = "Topic decomposition of chromatin tracing data"
authors = [
  {name = "ggautham07", email = "gautham.ganesh@cbs.cnrs.fr"},
  {name = "jbfiche"},
  {name = "marcnol", , email = "marcelo.nollmann@cbs.cnrs.fr"},
]
readme = "README.md"
requires-python = "3.13"
dependencies = [
    "numpy >= 1.21",
    "scipy >= 1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "umap-learn",
    "hdbscan"
]

[project.scripts]
topic3d = "routines.cli:main"
topic3d-run = "routines.run:main"
topic3d-run-dask = "routines.run_dask:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
