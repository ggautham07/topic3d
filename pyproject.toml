[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topic3d"
version = "0.0.0-dev.9"
description = "Topic decomposition of chromatin tracing data"
authors = [
  {name = "Gautham Ganesh"},
  {name = "Jean-Bernard Fiche"},
  {name = "Marcelo Nollmann", email = "Marcelo.Nollmann@cbs.cnrs.fr"},
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.0.0",
    "pandas>=2.3.2",
    "scikit-learn>=1.7.1",
    "matplotlib>=3.10.5"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "seaborn",
    "umap-learn",
    "hdbscan",
    "tqdm"
]

[project.scripts]
topic3d = "routines.cli:main"
topic3d-decompose = "routines.decompose:main"
topic3d-run = "routines.run_full:main"
topic3d-run-dask = "routines.run_full_dask:main"

[project.urls]
Repository = "https://github.com/ggautham07/topic3d.git"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]