[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topic3d"
version = "0.dev7"
description = "Topic decomposition of chromatin tracing data"
requires-python = ">=3.13"
dependencies = [
    "numpy >= 1.21",
    "scipy >= 1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "umap-learn",
    "hdbscan"
]

[project.scripts]
topic3d-run = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
